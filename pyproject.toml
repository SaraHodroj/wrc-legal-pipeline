[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrc-legal-pipeline"
version = "1.0.0"
description = "Partitioned, idempotent scraping pipeline for Irish workplace-relations decisions"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11,<3.0",
    "parsel>=1.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymongo>=4.7,<5.0",
    "boto3>=1.34",
    "itemadapter>=0.9",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "dagster>=1.7,<2.0",
    "dagster-webserver>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    # pymongo 4.9+ changed the bulk-write internals in a way mongomock does not
    # yet support; the pin keeps the infrastructure-free test suite honest.
    # Production code is compatible with the full >=4.7,<5.0 range.
    "pymongo>=4.7,<4.9",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mongomock>=4.1",
    "moto[s3]>=5.0",
    "certifi>=2024.2",
    "ruff>=0.5",
    # mypy 2.x currently hard-crashes (internal error) on this codebase;
    # pin to the 1.x series until that stabilises.
    "mypy>=1.10,<2.0",
]

[project.scripts]
wrc-ingest = "wrc_pipeline.scraping.runner:main"
wrc-transform = "wrc_pipeline.transform.job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
