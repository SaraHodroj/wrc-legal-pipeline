# Local infrastructure: NoSQL metadata store + S3-compatible object storage.
# Both are pinned to explicit minor versions -- 'latest' makes a build that
# worked yesterday fail today for reasons no commit explains.

services:
  mongo:
    image: mongo:7.0
    container_name: wrc-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-wrc}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Compose waits on this before starting the pipeline, so we never race
      # the database on a cold start.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: wrc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot job that creates the buckets so the pipeline never has to assume
  # a hand-configured environment.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_LANDING_BUCKET:-landing-zone} &&
      mc mb --ignore-existing local/${S3_CURATED_BUCKET:-curated-zone} &&
      echo 'Buckets ready';
      "

  dagster:
    build: .
    container_name: wrc-dagster
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-example}@mongo:27017
      S3_ENDPOINT_URL: http://minio:9000
      DAGSTER_HOME: /opt/dagster
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    volumes:
      - dagster_home:/opt/dagster
    command: >
      dagster dev
      -m wrc_pipeline.orchestration.definitions
      --host 0.0.0.0
      --port 3000

volumes:
  mongo_data:
  minio_data:
  dagster_home:
