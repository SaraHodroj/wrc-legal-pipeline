# Quality gate: every push and PR runs lint, type-check and the full test
# suite on both supported Python versions. The suite uses in-memory doubles
# (mongomock, moto), so CI needs no services and finishes in under a minute.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest --cov=wrc_pipeline --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build -t wrc-pipeline:ci .
